  const doc=new DOMParser().parseFromString(new TextDecoder().decode(buf),'text/html');
  document.title=doc.title||document.title;
  for(const st of doc.head.querySelectorAll('style,link[rel=stylesheet]'))document.head.appendChild(st);
  const page=document.getElementById('page');page.innerHTML=doc.body.innerHTML;
  document.getElementById('gate').remove();page.hidden=false;
  for(const old of page.querySelectorAll('script')){const sc=document.createElement('script');sc.textContent=old.textContent;old.replaceWith(sc)}
  try{sessionStorage.setItem('k',pw)}catch(e){}
}catch(e){document.getElementById('msg').innerHTML='ひらけませんでした。<br>お送りしたリンクを、そのままタップしてください。'}}
(function(){const m=location.hash.match(/[#&]k=([A-Za-z0-9]+)/)||location.search.match(/[?&]k=([A-Za-z0-9]+)/);
  if(m){open_(m[1]);return}
  let k=null;try{k=sessionStorage.getItem('k')}catch(e){}
  if(k)open_(k);else document.getElementById('msg').innerHTML='お送りしたリンクを、<br>そのままタップしてください。';})();
</script>
